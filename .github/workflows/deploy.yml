name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build
        run: hugo --minify

      # Fails the deploy if content ships with a missing title or description,
      # an unpaired page, or a link one language carries and the other does not.
      # Needs only content/, so it runs here with nothing else checked out.
      #
      # tools/check_cross_repo_links.sh is deliberately NOT wired here: it needs
      # all seven code repositories present to have anything to check against,
      # and this workflow checks out only this one. It would report
      # "checked 0 references / dead: 0" and pass while proving nothing. Run it
      # locally before publishing.
      - name: Translation completeness
        run: python3 tools/check_translation_completeness.py content

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
