# SPDX-License-Identifier: LGPL-2.1-or-later
name: Deploy to GitHub Pages

# A ci/** branch runs the build job and every gate in it; only main deploys.
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # The workflow checks and every self-test this repository ships. First,
      # so that nothing below -- in particular the download check, which
      # refuses until the release is tagged -- can stop a run before them.
      - name: Shared gates
        uses: LibreSCRS/ci/actions/gates@5b9410f9b0e6ab6983c39f931e118e68007c12b4

      - name: Setup Hugo
        # Pinned by commit: a moved tag on a third-party action would run its
        # code in this job. Nothing updates the pin for us -- move it deliberately.
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build
        run: hugo --minify

      # Fails the deploy if content ships with a missing title or description,
      # an unpaired page, or a link one language carries and the other does not.
      #
      # tools/check_cross_repo_links.sh is deliberately NOT wired here: it needs
      # all seven code repositories present in full, and this job checks out
      # one file of each and the headers of one. The script skips every
      # repository it cannot see, so in CI it would report "checked 0
      # references / dead: 0" and pass while proving nothing. Run it locally
      # before publishing.
      - name: Translation completeness
        run: python3 tools/check_translation_completeness.py content

      # The pages document a release, so everything below reads the code
      # repositories AT THE TAG data/artifacts.json names -- never a default
      # branch, where the first commit after the tag would rewrite what that
      # release published. Data generated over a ref that is not a tag is
      # marked provisional; the checkouts then take the default branch, and the
      # download check at the end refuses with exit 2, so this deploy cannot go
      # green on a provisional file.
      - name: The release the pages document
        id: release
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          data = json.load(open("data/artifacts.json"))
          tag = data["repos"][0]["tag"]
          print(f"tag={tag}")
          print(f"ref={'' if data.get('provisional') else tag}")
          EOF

      # Two pages that agree with each other say nothing about the code: a
      # symbol renamed in the library, and renamed on both pages, would leave
      # this site green while the guide published a name no header carries. So
      # the pages are held to the headers of the release they document: no
      # sentence the code has disproved, and every symbol in
      # tools/documented-api.txt documented in both languages and still named
      # by a public header. Without the headers the gate refuses (exit 2).
      - name: Check out LibreMiddleware's headers and declaration at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ steps.release.outputs.ref }}
          path: _release/LibreMiddleware
          sparse-checkout: |
            /include/
            /ci/release-assets.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: API claims match the shipped headers
        run: python3 tools/check_api_claims.py content _release/LibreMiddleware/include

      # Uploaded before the download check so that every step but that one is
      # exercised on a branch; deploy needs this whole job, so a red check
      # still publishes nothing.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./public

      # The download pages are held to data/artifacts.json, and the data to the
      # seven ci/release-assets.txt files it was generated from, at that tag.
      - name: Check out what LibreAgent declares at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreAgent
          ref: ${{ steps.release.outputs.ref }}
          path: _release/LibreAgent
          sparse-checkout: ci/release-assets.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check out what LibreLinux declares at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreLinux
          ref: ${{ steps.release.outputs.ref }}
          path: _release/LibreLinux
          sparse-checkout: ci/release-assets.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check out what LibreCelik declares at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreCelik
          ref: ${{ steps.release.outputs.ref }}
          path: _release/LibreCelik
          sparse-checkout: ci/release-assets.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check out what LibreKDE declares at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreKDE
          ref: ${{ steps.release.outputs.ref }}
          path: _release/LibreKDE
          sparse-checkout: ci/release-assets.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check out what LibreDarwin declares at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreDarwin
          ref: ${{ steps.release.outputs.ref }}
          path: _release/LibreDarwin
          sparse-checkout: ci/release-assets.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check out what LibreMac declares at that tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreMac
          ref: ${{ steps.release.outputs.ref }}
          path: _release/LibreMac
          sparse-checkout: ci/release-assets.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      # Last, and on purpose: before every repository is tagged this is exit 2
      # ("cannot judge a page about a release that does not exist yet") -- the
      # expected answer on a branch, and the reason deploy cannot run on
      # provisional data.
      - name: Download pages name only what the release publishes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 tools/check_download_claims.py content data/artifacts.json --repos-root _release --ref "$TAG"

  deploy:
    # The github-pages environment admits main alone; a branch run stops at the
    # build job instead of being refused here.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
